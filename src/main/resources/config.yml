# ============================================================
#  TimePerDayWhitelist - Konfiguration
# ============================================================

# Standard-Tageslimit in Minuten (gilt für alle Spieler ohne
# individuelles Limit).
default-limit-minutes: 60

# Warn-Nachrichten: bei wie vielen verbleibenden Sekunden
# wird der Spieler gewarnt?  (Liste von Sekundenwerten)
warnings:
  - 300   # 5 Minuten
  - 60    # 1 Minute
  - 30    # 30 Sekunden
  - 10    # 10 Sekunden

# Nachrichten (unterstützt MiniMessage-Format)
messages:
  kick-title: "<gradient:#ff6b6b:#ffd166><bold>Spielzeit fuer heute verbraucht</bold></gradient>"
  kick-line1: "<gray>Profil von <yellow>{player}</yellow><gray> - gespielt: <yellow>{played}</yellow> <dark_gray>| <gray>Limit: <yellow>{limit}</yellow>"
  kick-line2: "<gray>Heute verdient: <yellow>+{gained-level}</yellow> <dark_gray>| <gray>Session: <yellow>{session-points}</yellow>"
  kick-line3: "<gray>Gesamtlevel: <yellow>{total-level}</yellow> <dark_gray>| <gray>Bestes Kit: <yellow>{kit-level}</yellow>"
  kick-line4: "<gray>Du kannst morgen wieder spielen. Nutze dann <yellow>/timeleft</yellow><gray> fuer dein Profil."
  warning: "<yellow>⚠ {remaining} verbleibende Spielzeit heute!"
  join-title: "<gradient:#7bed9f:#70a1ff><bold>Willkommen zurueck, {player}!</bold></gradient>"
  join-info: "<gray>Verbleibend: <yellow>{remaining}</yellow> <dark_gray>| <gray>Gesamtlevel: <yellow>{total-level}</yellow> <dark_gray>| <gray>Bestes Kit: <yellow>{kit-level}</yellow>"
  join-line2: "<gray>Session heute: <yellow>{session-points}</yellow> <dark_gray>| <gray>Kit heute erhalten: <yellow>{kit-given}</yellow>"
  join-tip: "<gray>Tipp: Nutze jederzeit <yellow>/timeleft</yellow><gray> fuer deine komplette Profiluebersicht."

# Ob beim Einloggen die verbleibende Zeit angezeigt wird
show-on-join: true

# ============================================================
#  Progression (1 Stunde pro Tag)
# ============================================================
# Während der Tagesstunde sammelt man Session-Punkte über Items.
# Beim Ablauf der Zeit werden Session-Punkte 1:1 in Gesamtlevel umgewandelt.
progression:
  items:
    COAL:
      level: 0.03
    REDSTONE:
      level: 0.045
    LAPIS_LAZULI:
      level: 0.05
    RAW_IRON:
      level: 0.055
    IRON_INGOT:
      level: 0.08
    COPPER_INGOT:
      level: 0.06
    GOLD_INGOT:
      level: 0.1
    QUARTZ:
      level: 0.11
    AMETHYST_SHARD:
      level: 0.12
    DIAMOND:
      level: 0.2
    EMERALD:
      level: 0.22
    NETHERITE_SCRAP:
      level: 0.35

  # Kit-System: immer nur das höchste erreichte Kit wird vergeben.
  # Pro Tag nur 1x Kit pro Spieler.
  spawn-kits:
