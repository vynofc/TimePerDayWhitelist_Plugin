# SonarScanner configuration for TimePerDayWhitelist
# Set these two values to your SonarQube/SonarCloud project values.
sonar.projectKey=fun.vynofc:TimePerDayWhitelist
sonar.projectName=TimePerDayWhitelist

# Uncomment for SonarCloud and set your org key.
# sonar.organization=your-org

# Uncomment if you run your own SonarQube server.
# sonar.host.url=http://localhost:9000

sonar.projectVersion=1.2.0-beta2
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

sonar.exclusions=target/**,tmp_commit.md
sonar.coverage.exclusions=src/main/java/**
